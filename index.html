<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Contabilidade - Dashboard de Gestão Contábil</title>
  
  <!-- Google Fonts: Rethink Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Rethink Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- SheetJS (xlsx) para importação e exportação de planilhas -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <!-- Chart.js para os 7 gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Rethink Sans', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(150, 150, 150, 0.5);
    }
  </style>
</head>
<body class="bg-[#111116] text-gray-100 antialiased selection:bg-[#ECBD56] selection:text-[#111116]">
  <div id="app"></div>

  <!-- Script principal nativo (executa tanto via file:// quanto web server) -->
  <script src="app.js"></script>
</body>
</html>
